name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo test
        run: cargo test --workspace
      - name: Check the vendored testbeds against their pinned hashes
        run: scripts/check-vendored-testbeds.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run rustfmt
        run: cargo fmt --all -- --check

  codegen-drift:
    # actus-model/src/generated is produced from the vendored dictionary by
    # `cargo run -p actus-model --bin generate`; fail if the committed copy
    # differs from a fresh run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate the dictionary vocabulary from scratch
        # Deleting first means a committed file the generator no longer
        # writes also shows up as drift.
        # The generator is built before the directory is removed, because
        # actus-model itself compiles the generated modules.
        run: |
          cargo build -p actus-model --bin generate
          rm -rf crates/actus-model/src/generated
          ./target/debug/generate
      - name: Fail on drift
        run: |
          git status --porcelain -- crates/actus-model/src/generated
          test -z "$(git status --porcelain -- crates/actus-model/src/generated)"

  deny:
    # Licences, advisories, bans and sources (policy in deny.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    # Build and test on exactly the rust-version declared in Cargo.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Test on the MSRV with the committed lockfile
        run: cargo test --workspace --locked

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage with enforced floor (scripts/coverage.sh)
        run: scripts/coverage.sh --lcov | tee coverage-summary.txt
      - name: Publish summary
        if: always()
        run: |
          {
            echo '### Line coverage'
            echo '```'
            grep -E '^(Filename|TOTAL)|^-+$' coverage-summary.txt | head -3 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: target/lcov.info
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: Install frontend dependencies
        working-directory: crates/actus-web/assets
        run: npm install
      - name: Typecheck the client
        working-directory: crates/actus-web/assets
        run: npm run typecheck
      - name: Client unit tests (three timezones)
        working-directory: crates/actus-web/assets
        run: npm test
      - name: Build wasm bindings
        run: wasm-pack build crates/actus-wasm --target web --out-dir pkg
      - name: Read the locked wasm-bindgen version
        id: wasm-bindgen
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - name: Run binding tests in the wasm runtime (Node)
        run: cargo test -p actus-wasm --target wasm32-unknown-unknown --test wasm_runtime
      - name: Build site
        run: cargo run -p actus-web --bin build-site
      - name: Smoke test server
        run: |
          cargo run -p actus-web --bin actus-web &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/ | grep -q "ACTUS Explorer"
          curl -sf http://127.0.0.1:8080/index.js >/dev/null
          curl -sf http://127.0.0.1:8080/pkg/actus_wasm_bg.wasm >/dev/null
