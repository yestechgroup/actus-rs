# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/).
# CI runs `cargo deny check` (licenses, advisories, bans, sources).

[graph]
all-features = true

[advisories]
# Every RUSTSEC advisory (vulnerability, unmaintained, unsound, yanked)
# fails the check unless it is listed in `ignore` with a justification.
version = 2
yanked = "deny"
ignore = [
    # chrono is flagged unmaintained (no vulnerability). It is part of the
    # public API (every timestamp is a chrono::NaiveDateTime), so replacing it
    # is an API migration, tracked in #32 rather than done here.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no known vulnerability; migration decision tracked in yestechgroup/actus-rs#32" },
]

[licenses]
version = 2
# Permissive licences only, so every dependency can ship inside an MIT
# project with no extra obligations beyond keeping its notice.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are reported, not fatal: they come from the
# microsoft-webui / axum / wasm-bindgen trees we don't control.
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
