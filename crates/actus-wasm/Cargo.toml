[package]
name = "actus-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings exposing ACTUS metadata, validation and evaluation to browser clients"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
actus-model = { path = "../actus-model" }
actus-engine = { path = "../actus-engine" }

# Runs tests/wasm_runtime.rs under Node via wasm-bindgen-test-runner
# (`cargo test -p actus-wasm --target wasm32-unknown-unknown`).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
