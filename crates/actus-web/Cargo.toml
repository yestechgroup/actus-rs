[package]
name = "actus-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ACTUS Explorer: WebUI-based web visualizer for the ACTUS financial contract standard (issue #1)"

[lib]
name = "actus_web"
path = "src/lib.rs"

[[bin]]
name = "actus-web"
path = "src/main.rs"

[[bin]]
name = "build-site"
path = "src/bin/build-site.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
microsoft-webui = { workspace = true }
microsoft-webui-handler = "0.0.29"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
actus-model = { path = "../actus-model" }
actus-engine = { path = "../actus-engine" }
actus-wasm = { path = "../actus-wasm" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
